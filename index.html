<!DOCTYPE html> 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьная физика</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-orange: #f59e0b;
            --accent-green: #10b981; 
            --accent-cyan: #06b6d4;
            --accent-rose: #f43f5e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.5;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        section:hover {
            transform: translateY(-4px);
        }

        h3 {
            margin-top: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        /* Цветовые акценты для разделов */
        .mechanics h3 { color: var(--accent-blue); }
        .molecule h3 { color: var(--accent-green); }
        .electro h3 { color: var(--accent-orange); }
        .waves h3 { color: var(--accent-cyan); }
        .optics h3 { color: var(--accent-purple); }
        .quantum h3 { color: var(--accent-rose); }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 12px;
        }

        a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            display: block;
            padding: 8px 12px;
            border-radius: 8px;
            background: #f1f5f9;
            transition: all 0.2s ease;
        }

        a:hover {
            background: var(--accent-blue);
            color: white;
        }

        .molecule a:hover { background: var(--accent-green); }
        .optics a:hover { background: var(--accent-purple); }
        .electro a:hover { background: var(--accent-orange); }
        .waves a:hover { background: var(--accent-cyan); }
        .quantum a:hover { background: var(--accent-rose); }

    </style>
</head>
<body>

    <h1>Каталог презентаций, симуляций и задач</h1>
    <p class="subtitle">Интерактивный класс по физике</p>

    <div class="grid">

        <!-- Теория, 7 класс -->
        <section class="theory_7gr">
            <h3>Теория. 7 класс</h3>
            <ul>
                <li><a href="7th_grade/simple_machines.html">Рычаг, блоки и КПД</a></li>
            </ul>
        </section> 

        <!-- Симуляции, 7 класс -->
        <section class="theory_7gr">
            <h3>Симуляции. 7 класс</h3>
            <ul>
                <li><a href="7th_grade/simple_machines_game.html">Рычаг, блоки и КПД</a></li>
            </ul>
        </section> 
        
    </div>

</body>
</html>
